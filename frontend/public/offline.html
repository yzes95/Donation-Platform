<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت | منصة عطاء</title>
  <style>
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background-color: #FAFAF9;
      color: #1C1917;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      max-width: 460px;
      width: 100%;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      color: #0F766E;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #0F766E;
    }
    p {
      color: #78716C;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #0F766E;
      color: white;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .notice {
      font-size: 13px;
      color: #A8A29E;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-5.657m0 0a9 9 0 012.828-5.657m0 0l2.829 2.829m-2.829-2.829L3 3m5.657 12.728a5 5 0 01-1.414-3.536m0 0a5 5 0 011.414-3.536m0 0l2.829 2.829" />
    </svg>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصال الإنترنت مقطوع حالياً. يمكنك تصفح الصفحات المحفوظة مؤقتاً، ولن تتمكن من تنفيذ عمليات الدفع الحساسة حتى يعود الاتصال.</p>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
    <div class="notice">Ataa Platform — Offline Fallback</div>
  </div>
</body>
</html>
